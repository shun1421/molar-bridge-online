<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モル・ブリッジ オンライン</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="game-container">
        <header>
            <div class="header-content">
                <h1>🧪 モル・ブリッジ</h1>
                <div class="status-bar">
                    <span id="score-display">スコア: 0</span>
                    <span id="life-display">
                        <i class="fas fa-heart"></i>
                        <i class="fas fa-heart"></i>
                        <i class="fas fa-heart"></i>
                    </span>
                </div>
            </div>
        </header>

        <main>
            <section class="game-world">
                <div class="sky"></div>
                <div class="valley">
                    <div class="far-side"></div>
                    <div id="bridge" class="bridge"></div>
                    <div id="character" class="character beaker">
                        <i class="fas fa-beaker"></i>
                    </div>
                </div>
            </section>

            <section class="quiz-area">
                <div class="question-card">
                    <h2>問題 <span id="question-number">1</span></h2>
                    <p id="question-text" class="question-text">読み込み中...</p>
                </div>
                <div id="answer-options" class="answer-options">
                    </div>
                <button id="next-btn" class="next-btn hidden">次の問題へ <i class="fas fa-arrow-right"></i></button>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>

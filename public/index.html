<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Molar Bridge Online</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <section id="home-screen" class="screen">
            <h1>Molar Bridge</h1>
            <div class="menu-buttons">
                <button onclick="showScreen('individual-mode')" class="btn-primary">個人学習モード</button>
                <button onclick="showScreen('battle-setup')" class="btn-secondary">集団対戦モード</button>
            </div>
        </section>

        <section id="individual-mode" class="screen hidden">
            <div class="header">
                <span id="quiz-progress">1/5</span>
                <button onclick="showScreen('home-screen')" class="btn-small">戻る</button>
            </div>
            <div class="question-card" id="ind-question">
                </div>
            <div id="ind-operator-choices" class="card-grid">
                </div>
            <div id="ind-feedback" class="feedback hidden"></div>
        </section>

        <section id="battle-setup" class="screen hidden">
            <h2>対戦準備</h2>
            <input type="text" id="player-name" placeholder="名前を入力">
            <div class="room-controls">
                <button onclick="createRoom()" class="btn-primary">部屋を作る</button>
                <div class="join-group">
                    <input type="text" id="room-code-input" placeholder="部屋コード">
                    <button onclick="joinRoom()" class="btn-secondary">参戦する</button>
                </div>
            </div>
            <button onclick="showScreen('home-screen')" class="btn-back">戻る</button>
        </section>

        <section id="battle-mode" class="screen hidden">
            <div class="battle-info">
                <span id="display-room-code">Code: ----</span>
                <span id="turn-indicator">誰かのターン</span>
            </div>
            <div class="equation-area" id="battle-question">
                </div>
            
            <div class="slots-container">
                <div class="slot" id="slot-1"><span>Slot 1</span><div class="slot-content"></div></div>
                <div class="slot" id="slot-2"><span>Slot 2</span><div class="slot-content"></div></div>
                <div class="slot" id="slot-3"><span>Slot 3</span><div class="slot-content"></div></div>
            </div>

            <div class="player-hand" id="player-hand">
                </div>
            
            <div class="battle-actions">
                <button onclick="drawCard()" class="btn-draw">山札から引く</button>
            </div>
        </section>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
